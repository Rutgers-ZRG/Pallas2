name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install torch_fplib (vendored sdist; not yet on PyPI)
        run: pip install ci/vendor/torch_fplib-0.1.0.tar.gz
      - name: Install pallas
        run: pip install -e .[test]
      - name: Lint
        run: ruff check pallas/
      - name: Unit + integration tests
        run: pytest -m "unit or integration" -v
